name: Check prices

on:
  schedule:
    - cron: "3 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      USE_TOR: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Locate Camoufox cache
        id: camoufox
        working-directory: backend
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { INSTALL_DIR } from "camoufox-js/dist/pkgman.js";
            const { version } = JSON.parse(fs.readFileSync("node_modules/camoufox-js/package.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\npath=${INSTALL_DIR}\n`);
          '

      - name: Cache Camoufox browser
        uses: actions/cache@v4
        with:
          path: ${{ steps.camoufox.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-camoufox-js-${{ steps.camoufox.outputs.version }}

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Fetch Camoufox browser
        working-directory: backend
        run: npx camoufox-js fetch

      - name: Install Playwright browser dependencies
        working-directory: backend
        run: npx playwright install --with-deps firefox

      - name: Install Tor and Privoxy
        if: env.USE_TOR == 'true'
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y tor privoxy

      - name: Start Tor and wait for bootstrap
        if: env.USE_TOR == 'true'
        continue-on-error: true
        run: |
          echo "TOR_READY=false" >> "$GITHUB_ENV"
          sudo install -d -o debian-tor -g debian-tor -m 0750 /var/log/tor
          sudo install -o debian-tor -g debian-tor -m 0640 /dev/null /var/log/tor/pricepatrol.log
          printf '\nLog notice file /var/log/tor/pricepatrol.log\n' | sudo tee -a /etc/tor/torrc > /dev/null
          sudo service tor stop
          sudo service tor start
          sudo tee /etc/privoxy/config > /dev/null <<'EOF'
          listen-address 127.0.0.1:8118
          forward-socks5t / 127.0.0.1:9050 .
          EOF
          sudo service privoxy restart

          deadline=$((SECONDS + 90))
          while (( SECONDS < deadline )); do
            if sudo grep -q 'Bootstrapped 100%' /var/log/tor/pricepatrol.log; then
              echo "TOR_READY=true" >> "$GITHUB_ENV"
              echo "Tor bootstrapped; all Camoufox traffic will use Privoxy on 127.0.0.1:8118."
              curl -s --connect-timeout 10 --max-time 20 --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip || true
              echo
              exit 0
            fi
            sleep 2
          done

          echo "Tor bootstrap timed out after 90s; continuing without Tor."
          sudo cat /var/log/tor/pricepatrol.log || true

      - name: Run price monitor
        working-directory: backend
        env:
          PRICEPATROL_HEADLESS: "true"
          BROWSER_ENGINE: camoufox
          PROXY_URL: ${{ secrets.PROXY_URL }}
          NODE_ENV: production
        run: npm run check:prices

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update daily price data"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
