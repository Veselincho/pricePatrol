name: Check prices

on:
  schedule:
    - cron: "3 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Locate Camoufox cache
        id: camoufox
        working-directory: backend
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { INSTALL_DIR } from "camoufox-js/dist/pkgman.js";
            const { version } = JSON.parse(fs.readFileSync("node_modules/camoufox-js/package.json", "utf8"));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\npath=${INSTALL_DIR}\n`);
          '

      - name: Cache Camoufox browser
        uses: actions/cache@v4
        with:
          path: ${{ steps.camoufox.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-camoufox-js-${{ steps.camoufox.outputs.version }}

      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Fetch Camoufox browser
        working-directory: backend
        run: npx camoufox-js fetch

      - name: Install Playwright browser dependencies
        working-directory: backend
        run: npx playwright install --with-deps firefox

      - name: Run price monitor
        working-directory: backend
        env:
          PRICEPATROL_HEADLESS: "true"
          BROWSER_ENGINE: camoufox
          PROXY_URL: ${{ secrets.PROXY_URL }}
          NODE_ENV: production
        run: npm run check:prices

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update daily price data"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
