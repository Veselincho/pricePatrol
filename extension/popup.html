<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --surface-muted: #eef2f7;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e5ebf5;
      --border-strong: #d9e2ef;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #dbeafe;
      --primary-text: #1d4ed8;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --focus: rgba(59, 130, 246, 0.35);
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0b1220;
        --surface: #101826;
        --surface-soft: #121b2b;
        --surface-muted: #172238;
        --text: #e2e8f0;
        --text-muted: #94a3b8;
        --border: #223047;
        --border-strong: #2a3952;
        --shadow: 0 14px 34px rgba(0, 0, 0, 0.34);
        --primary: #60a5fa;
        --primary-hover: #3b82f6;
        --primary-soft: rgba(96, 165, 250, 0.16);
        --primary-text: #93c5fd;
        --danger: #f87171;
        --danger-soft: rgba(248, 113, 113, 0.16);
        --focus: rgba(147, 197, 253, 0.38);
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; }
    body {
      min-width: 320px;
      min-height: 100vh;
      padding: 10px;
      background: radial-gradient(120% 120% at 50% 0%, color-mix(in srgb, var(--primary-soft) 40%, transparent) 0%, var(--bg) 42%);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button {
      font: inherit;
      border: 0;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: transform 120ms ease, background-color 120ms ease, box-shadow 120ms ease, border-color 120ms ease, opacity 120ms ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .shell {
      display: grid;
      gap: 12px;
      width: min(100%, 420px);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .hero {
      display: grid;
      gap: 12px;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .brand {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    .title {
      margin: 0;
      font-size: 17px;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }



    #repo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      padding: 8px 11px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-text);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      text-align: left;
      word-break: break-word;
    }

    #repo::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 15%, transparent);
      flex: 0 0 auto;
    }

    .toolbar {
      display: grid;
      gap: 10px;
    }

    .toolbar-main {
      display: flex;
      gap: 10px;
    }

    #save {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 42px;
      padding: 11px 14px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 8px 18px color-mix(in srgb, var(--primary) 24%, transparent);
    }

    #save:hover:not(:disabled) { background: var(--primary-hover); }

    #settings,
    #refresh {
      min-height: 42px;
      padding: 11px 14px;
      background: var(--surface-muted);
      color: var(--text);
      font-weight: 700;
      border: 1px solid var(--border);
    }

    #settings { min-width: 84px; flex: 0 0 auto; }
    #refresh { width: 100%; }

    #save:disabled,
    #settings:disabled,
    #refresh:disabled {
      opacity: 0.6;
      cursor: default;
      transform: none;
    }

    .helper-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .tip {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.45;
      padding-top: 1px;
    }

    #status {
      min-height: 18px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.4;
      word-break: break-word;
      text-align: right;
      flex: 1 1 100%;
    }

    #status[data-kind="error"] { color: var(--danger); }
    #status[data-kind="success"] { color: var(--primary-text); }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 9px;
    }

    h3 {
      margin: 0;
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    #products-count {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 330px;
      overflow: auto;
      scrollbar-gutter: stable;
    }

    li {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }

    li:last-child { border-bottom: 0; }

    .item-link {
      flex: 1;
      min-width: 0;
      display: block;
      padding: 9px 12px;
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      border: 1px solid transparent;
      transition: background-color 120ms ease, border-color 120ms ease, transform 120ms ease;
    }

    .item-link:hover {
      background: var(--surface-soft);
      border-color: var(--border);
    }

    .item-title {
      display: block;
      margin-bottom: 4px;
      font-weight: 700;
      line-height: 1.25;
      word-break: break-word;
    }

    .item-meta {
      display: block;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.4;
      word-break: break-word;
    }

    .actions {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
    }

    .delete-btn {
      min-height: 38px;
      padding: 8px 12px;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .delete-btn:disabled {
      opacity: 0.6;
      cursor: default;
      transform: none;
    }

    .empty {
      color: var(--text-muted);
      padding: 10px 2px 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="card hero" aria-label="Quick actions">
      <div class="hero-top">
        <div class="brand">
          <h1 class="title">pricePatrol</h1>
          <div id="repo" aria-live="polite">Repository not configured</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="toolbar-main">
          <button id="save" type="button">Save current price</button>
          <button id="settings" type="button" title="Open settings">Settings</button>
        </div>
        <button id="refresh" type="button">Refresh list</button>
      </div>

      <div class="helper-row">
        <div class="tip">Tip: click a product row to open its dashboard.</div>
        <div id="status" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section class="card" aria-label="Tracked products">
      <div class="section-head">
        <h3>All products</h3>
        <div id="products-count">0 products</div>
      </div>
      <ul id="list"></ul>
    </section>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
